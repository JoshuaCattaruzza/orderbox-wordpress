# Overrides the base image's Debian default (MaxRequestWorkers 150,
# MaxConnectionsPerChild 0), bind-mounted by docker-compose.yml so it applies
# without rebuilding orderbox-wordpress-base.
#
# 150 workers × a 128M PHP limit could claim far more memory than the VM has,
# and was part of what let mysqld get OOM-killed (2026-07-30, 2026-09-24).
# 30 is ample: the busiest minute on record is ~564 req/min (~10 req/s).
# Beyond 30 in flight, Apache queues instead of spawning.
#
# MaxConnectionsPerChild recycles each worker after 1000 connections, so the
# slow per-process memory creep seen over long uptimes can't accumulate.
<IfModule mpm_prefork_module>
	StartServers             5
	MinSpareServers          5
	MaxSpareServers         10
	MaxRequestWorkers       30
	MaxConnectionsPerChild 1000
</IfModule>
